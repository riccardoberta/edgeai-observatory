# EdgeAI Observatory — Monitored Sources Configuration
#
# This file is the single source of truth for what the Observatory monitors.
# Edit it directly to add, remove, or disable sources — no need to touch
# project instructions. Each entry should be self-explanatory; "status:
# active" sources are checked during weekly/monthly monitoring cycles,
# "status: paused" ones are kept for reference but skipped.
#
# last_checked: the date (YYYY-MM-DD) this source last actually contributed
# to a weekly digest or monthly report — not just "in scope." Set to null
# when there is no record of it ever being checked; do not guess a date.
# Update it whenever a digest/report cites this source.

digital_libraries:
  - name: arXiv
    url: https://arxiv.org
    categories: [cs.LG, cs.AR, cs.DC, eess.SP]
    access: open
    status: active
    notes: "Primary source for preprints; check daily/weekly listings on relevant categories."
    last_checked: 2026-09-02

  - name: IEEE Xplore
    url: https://ieeexplore.ieee.org
    access: institutional (discovery via WebSearch needs no login; full text needs unige.it)
    access_notes: "Primary discovery method (2026-09-02, works unattended, no login needed): WebSearch with `site:ieeexplore.ieee.org <query>`. Confirmed to reliably surface titles, venues, dates, and often a synthesized abstract-level snippet without any institutional session — this is what makes IEEE coverage usable in the unattended Weekly/Monthly runs, where a live logged-in browser is never available. `web_fetch` on individual ieeexplore.ieee.org URLs returns an empty client-rendered shell (paywalled, no server-rendered abstract) — do not rely on it. For full text or a deeper read (e.g. before writing a `02_Papers/` deep-analysis record), use the Claude in Chrome extension on Ricky's browser while he is on the unige.it campus network/VPN/proxy; this stays an on-demand, Ricky-present step, not part of the unattended pipeline. Note: search-result listing pages do not expose reliable per-item indexing/publication dates, so date-filter results by opening the individual record, not the listing page."
    status: active
    last_checked: 2026-09-02

  - name: ACM Digital Library
    url: https://dl.acm.org
    access: institutional (discovery via WebSearch needs no login; full text needs unige.it)
    access_notes: "Same pattern as IEEE Xplore: WebSearch with `site:dl.acm.org <query>` is the primary, unattended-safe discovery method (confirmed working 2026-09-02, also surfaces IEEE-co-published venues like IEEE/ACM Transactions on Networking). Claude in Chrome + unige.it institutional access remains the on-demand path for full text / deep-analysis records. Direct `web_fetch` has previously hit a bot/security-verification interstitial — don't rely on it either."
    status: active
    last_checked: 2026-09-02

  - name: MDPI
    url: https://www.mdpi.com
    access: open
    access_notes: "Fully open access — confirmed 2026-09-02 that `web_fetch` retrieves full article text directly, no login or Chrome needed, same as arXiv. Relevant journals for this Observatory: Sensors, Electronics, Information, Applied Sciences, Future Internet. Use WebSearch with `site:mdpi.com <query>` for discovery, then `web_fetch` the resulting article URL directly for full text (works even for 02_Papers/-grade deep analysis, not just title/abstract-level digest entries)."
    status: active
    last_checked: 2026-09-02

  - name: Elsevier (ScienceDirect)
    url: https://www.sciencedirect.com
    access: mostly institutional (discovery via WebSearch needs no login; some articles fully open access)
    access_notes: "WebSearch with `site:sciencedirect.com <query>` works unattended and no login needed (confirmed 2026-09-02) for discovery — titles, journal/venue, and often a synthesized snippet. Most articles are paywalled (`web_fetch` on the article page will likely return an empty or truncated shell); check each result for an open-access badge before assuming full text is reachable without unige.it access. For paywalled full text, same on-demand Claude in Chrome + unige.it pattern as IEEE/ACM."
    status: active
    last_checked: 2026-09-02

  - name: Springer (SpringerLink)
    url: https://link.springer.com
    access: mostly institutional (discovery via WebSearch needs no login; some articles/chapters fully open access)
    access_notes: "Same pattern as Elsevier: WebSearch with `site:link.springer.com <query>` works unattended for discovery (confirmed 2026-09-02); many results are book chapters (Springer's `/chapter/` URLs) rather than journal articles, worth noting when citing. Most content is paywalled; open-access articles/chapters exist and are worth a direct `web_fetch` attempt, but institutional access via Claude in Chrome + unige.it is the reliable fallback for full text."
    status: active
    last_checked: 2026-09-02

  - name: Google Scholar
    url: https://scholar.google.com
    access: open (aggregator, links may lead to paywalled publishers)
    access_notes: "No official API — use Claude in Chrome to run searches and read result pages. Useful as a cross-publisher aggregator: finds papers not indexed on arXiv, surfaces citation counts to gauge influence, and often links directly to a free PDF (publisher page, author repository, or institutional repo) even for papers behind a paywall elsewhere. Use sparingly and avoid rapid automated querying, since Google Scholar's terms discourage scripted scraping. Confirmed working unige.it full-text links ('Testo completo su UNIGE') as of 2026-09-02. Kept as a supplementary, on-demand cross-check (still Chrome-dependent) — WebSearch with `site:` filters across the digital libraries above is now the primary, unattended-safe discovery method, Scholar adds citation-count/influence signal on top of that. Its author-search and per-profile 'sort by date' views are also the checking mechanism for the `research_groups_and_authors` watchlist below — see that section for why topic-only WebSearch isn't enough on its own."
    status: active
    last_checked: 2026-09-02

# Author/lab-level watchlist — added 2026-09-03, complements the topic-keyword
# discovery above rather than replacing it.
#
# Why this exists: WebSearch site: queries (the primary discovery method above)
# rank by relevance to the query phrase, which structurally favors work that is
# already well-cited and prominently indexed. It can miss papers from smaller
# or newer groups, or papers using different terminology than the query,
# regardless of the work's actual quality or relevance — including, as
# discovered on 2026-09-03, several of Ricky's own papers (see the
# 01_Knowledge_Base concept "Evolution of the concept" entries added that day
# for the resulting historical-backfill pass). This list tracks specific
# authors/groups whose work recurs heavily across this KB, checked directly by
# name/profile instead of by topic phrase.
#
# Checking method: Google Scholar has no API and its terms discourage
# scripted/automated querying (see the Google Scholar entry above), so these
# are NOT part of the unattended weekly/monthly WebSearch pass. Check each
# profile via Claude in Chrome as an explicit, on-demand step during a
# monitoring cycle (open the scholar_url, sort by date, read the newest few
# entries). A zero-scraping complement: each author/lab's Scholar profile page
# has a "Follow" button offering email alerts for new articles — set up once
# by hand (Ricky, on his own Scholar-linked inbox), after which new items
# arrive as email and can be read directly during the weekly cycle instead of
# requiring a live browser check at all.
research_groups_and_authors:
  - name: Riccardo Berta / ELIOS Lab (University of Genoa, DITEN)
    scholar_url: https://scholar.google.it/citations?user=Y9h_TMwAAAAJ&hl=it
    why_tracked: "Ricky's own research group. The topic-only discovery process had missed several of its own directly relevant papers (found 2026-09-03) — this entry exists specifically to close that gap going forward."
    status: active
    last_checked: null
  - name: Song Han / MIT HAN Lab
    scholar_url: https://scholar.google.com/citations?user=E0iCaa4AAAAJ&hl=en
    why_tracked: "Most recurring group in this KB's citation graph (MCUNet, TinyTL, AWQ, Once-for-All, and related on-device/quantization work) — a natural author-level anchor for the Algorithms branch."
    status: active
    last_checked: null
  - name: Luca Benini (ETH Zürich / Università di Bologna)
    scholar_url: https://scholar.google.com/citations?user=8riq3sYAAAAJ&hl=en
    why_tracked: "PULP platform lineage (GAP-8, Spatz, MATCH) recurs throughout the Hardware and Frameworks branches of this KB."
    status: active
    last_checked: null
  - name: Pete Warden (TensorFlow Lite Micro / Speech Commands)
    scholar_url: https://scholar.google.com/citations?user=VOWP8TUAAAAJ&hl=en
    why_tracked: "Originated TFLM and the Speech Commands dataset, both foundational references this KB cites repeatedly."
    status: active
    last_checked: null
  - name: Tianqi Chen (Apache TVM / microTVM, CMU)
    scholar_url: https://scholar.google.com/citations?user=7nlvOMQAAAAJ&hl=en
    why_tracked: "Original TVM/microTVM author; relevant to the Frameworks branch and the compiler-related open problems tracked there (e.g. TensorFlow_Lite_Micro's interpreter-vs-compiled-code gap)."
    status: active
    last_checked: null

  # To add an author/group: find their Google Scholar profile URL, add an
  # entry with a one-line why_tracked justification grounded in actual
  # recurrence in this KB (not just general fame), and leave last_checked
  # null until it has actually been checked in a monitoring cycle.

conferences:
  # Checking method (added 2026-09-03): entries below previously had no actual
  # monitoring mechanism — last_checked was null on every one because nothing
  # had ever queried them; the URLs were listed for reference only. Proceedings
  # for these venues are not something to browse from the conference homepage
  # directly (often paywalled, javascript-heavy, or organized by session
  # rather than by paper list). The practical check is WebSearch with
  # `site:dblp.org <conference name> <year>` (DBLP indexes accepted papers
  # promptly and its listing pages are plain HTML) or `site:openreview.net
  # <conference name> <year>` for ICLR/NeurIPS/ICML specifically, since those
  # three publish via OpenReview. Expect a lag of weeks to months between an
  # event's dates and its proceedings being fully indexed — check against the
  # conference's own dates, not against when it was last monitored.
