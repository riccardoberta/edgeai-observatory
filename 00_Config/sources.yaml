# EdgeAI Observatory — Monitored Sources Configuration
#
# This file is the single source of truth for what the Observatory monitors.
# Edit it directly to add, remove, or disable sources — no need to touch
# project instructions. Each entry should be self-explanatory; "status:
# active" sources are checked during weekly/monthly monitoring cycles,
# "status: paused" ones are kept for reference but skipped.
#
# last_checked: the date (YYYY-MM-DD) this source last actually contributed
# to a weekly digest or monthly report — not just "in scope." Set to null
# when there is no record of it ever being checked; do not guess a date.
# Update it whenever a digest/report cites this source.

digital_libraries:
  - name: arXiv
    url: https://arxiv.org
    categories: [cs.LG, cs.AR, cs.DC, eess.SP]
    access: open
    status: active
    notes: "Primary source for preprints; check daily/weekly listings on relevant categories."
    last_checked: 2026-09-02

  - name: IEEE Xplore
    url: https://ieeexplore.ieee.org
    access: institutional (discovery via WebSearch needs no login; full text needs unige.it)
    access_notes: "Primary discovery method (2026-09-02, works unattended, no login needed): WebSearch with `site:ieeexplore.ieee.org <query>`. Confirmed to reliably surface titles, venues, dates, and often a synthesized abstract-level snippet without any institutional session — this is what makes IEEE coverage usable in the unattended Weekly/Monthly runs, where a live logged-in browser is never available. `web_fetch` on individual ieeexplore.ieee.org URLs returns an empty client-rendered shell (paywalled, no server-rendered abstract) — do not rely on it. For full text or a deeper read (e.g. before writing a `02_Papers/` deep-analysis record), use the Claude in Chrome extension on a browser signed in on the unige.it campus network/VPN/proxy; this stays an on-demand, human-present step, not part of the unattended pipeline. Note: search-result listing pages do not expose reliable per-item indexing/publication dates, so date-filter results by opening the individual record, not the listing page."
    status: active
    last_checked: 2026-09-02

  - name: ACM Digital Library
    url: https://dl.acm.org
    access: institutional (discovery via WebSearch needs no login; full text needs unige.it)
    access_notes: "Same pattern as IEEE Xplore: WebSearch with `site:dl.acm.org <query>` is the primary, unattended-safe discovery method (confirmed working 2026-09-02, also surfaces IEEE-co-published venues like IEEE/ACM Transactions on Networking). Claude in Chrome + unige.it institutional access remains the on-demand path for full text / deep-analysis records. Direct `web_fetch` has previously hit a bot/security-verification interstitial — don't rely on it either."
    status: active
    last_checked: 2026-09-02

  - name: MDPI
    url: https://www.mdpi.com
    access: open
    access_notes: "Fully open access — confirmed 2026-09-02 that `web_fetch` retrieves full article text directly, no login or Chrome needed, same as arXiv. Relevant journals for this Observatory: Sensors, Electronics, Information, Applied Sciences, Future Internet. Use WebSearch with `site:mdpi.com <query>` for discovery, then `web_fetch` the resulting article URL directly for full text (works even for 02_Papers/-grade deep analysis, not just title/abstract-level digest entries)."
    status: active
    last_checked: 2026-09-02

  - name: Elsevier (ScienceDirect)
    url: https://www.sciencedirect.com
    access: mostly institutional (discovery via WebSearch needs no login; some articles fully open access)
    access_notes: "WebSearch with `site:sciencedirect.com <query>` works unattended and no login needed (confirmed 2026-09-02) for discovery — titles, journal/venue, and often a synthesized snippet. Most articles are paywalled (`web_fetch` on the article page will likely return an empty or truncated shell); check each result for an open-access badge before assuming full text is reachable without unige.it access. For paywalled full text, same on-demand Claude in Chrome + unige.it pattern as IEEE/ACM."
    status: active
    last_checked: 2026-09-02

  - name: Springer (SpringerLink)
    url: https://link.springer.com
    access: mostly institutional (discovery via WebSearch needs no login; some articles/chapters fully open access)
    access_notes: "Same pattern as Elsevier: WebSearch with `site:link.springer.com <query>` works unattended for discovery (confirmed 2026-09-02); many results are book chapters (Springer's `/chapter/` URLs) rather than journal articles, worth noting when citing. Most content is paywalled; open-access articles/chapters exist and are worth a direct `web_fetch` attempt, but institutional access via Claude in Chrome + unige.it is the reliable fallback for full text."
    status: active
    last_checked: 2026-09-02

  - name: Google Scholar
    url: https://scholar.google.com
    access: open (aggregator, links may lead to paywalled publishers)
    access_notes: >
      No official API — use Claude in Chrome to run searches and read result
      pages. This is the Observatory's broadest topic-based discovery source:
      unlike the per-library `site:` WebSearch queries above, a single Scholar
      keyword search aggregates across IEEE, ACM, MDPI, Elsevier, Springer,
      conference proceedings, theses, and repositories not covered by any
      single `site:` filter, and surfaces citation counts to gauge influence.
      Use sparingly and avoid rapid automated querying (Scholar's terms
      discourage scripted scraping); confirmed working unige.it full-text
      links ("Testo completo su UNIGE") as of 2026-09-02.

      Two ways this is used (added 2026-09-03, replacing an earlier
      author-watchlist approach that was rejected):

      1. Topic keyword search, on-demand: during each weekly/monthly cycle,
      run Scholar searches (via Claude in Chrome) for the taxonomy's core
      terms, sorted by date, as a broader complement to the `site:`-filtered
      WebSearch pass — not a replacement for it, since `site:` queries reach
      full text and abstracts on open-access libraries (MDPI) more reliably
      than Scholar's own result pages do.

      2. Topic keyword alerts, unattended: set up Google Scholar
      Alerts (scholar.google.com → "Create alert") for a working set of
      taxonomy-derived queries — starting set: "TinyML quantization",
      "on-device learning microcontroller", "neural architecture search edge
      deployment", "knowledge distillation edge inference", "federated
      learning resource-constrained devices", "TensorFlow Lite Micro OR
      CMSIS-NN OR microTVM", "edge AI accelerator NPU". Google runs the
      recurring search on its own infrastructure and emails new matches — no
      scraping, no live browser session required — and those emails get read
      during the weekly cycle same as any other source. This is what actually
      solves the "must be interactive" limitation above for topic-based
      coverage; extend the query list as the taxonomy grows.
    status: active
    last_checked: 2026-09-02

conferences:
  # Checking method (added 2026-09-03): entries below previously had no actual
  # monitoring mechanism — last_checked was null on every one because nothing
  # had ever queried them; the URLs were listed for reference only. Proceedings
  # for these venues are not something to browse from the conference homepage
  # directly (often paywalled, javascript-heavy, or organized by session
  # rather than by paper list). The practical check is WebSearch with
  # `site:dblp.org <conference name> <year>` (DBLP indexes accepted papers
  # promptly and its listing pages are plain HTML) or `site:openreview.net
  # <conference name> <year>` for ICLR/NeurIPS/ICML specifically, since those
  # three publish via OpenReview. Expect a lag of weeks to months between an
  # event's dates and its proceedings being fully indexed — check against the
  # conference's own dates, not against when it was last monitored.
