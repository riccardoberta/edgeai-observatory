          to the Ghent/imec anchor, so Jetson-class hardware is clearly a
          recurring deployment target. Neither is a characterization
          study of the hardware itself, which is the bar this candidate
          set, so status stays "watching".

      - source: 02_Papers/2025/2025_Chakraborty_ProfilingJetsonVisionInference.md
        papers:
          - "Profiling Concurrent Vision Inference Workloads on NVIDIA Jetson -- Extended"
        note: >
          Identified during a 2026-09-02 coverage-gap-closing pass: NVIDIA
          is an actively-monitored hardware vendor in
          00_Config/sources.yaml, but the Hardware taxonomy branch has no
          node for edge-GPU-class accelerators (Cortex-M, Cortex-A,
          RISC-V, DSP, FPGA, NPU cover no GPU tier). This paper is a
          genuine, real microarchitecture-level characterization of Jetson
          edge GPUs under concurrent vision inference (Ghent
          University/imec), the first anchor for this candidate.

    rationale: >
      A single paper so far. Given a well-established, unambiguously real
      hardware category (unlike more speculative emerging-hardware gaps),
      the bar is the same two-independent-anchor convention applied
      elsewhere in Hardware — kept "watching" pending a second,
      independent Jetson/edge-GPU characterization paper.

    action_hint: monitor for a second, independent edge-GPU/Jetson-class characterization paper before review

  - id: certified-selective-inference-imperfect-edge-accelerators
    title: "Certified / Risk-Aware Selective Inference for Imperfect Physical Edge Accelerators"

    status: watching

    first_seen: 2026-09-06
    last_seen: 2026-09-06

    possible_existing_concept: null

    evidence:
      - source: 03_Digests/Weekly/2026-09-06_weekly_digest.md
        papers:
          - "RACE-AIMC: Selective Inference for Heterogeneous Analog In-Memory Accelerators at the Edge"
        note: >
          RACE-AIMC (Yousuf, Lueker-Boden) computes a mathematically exact,
          per-chip upper bound on error rate for a pool of heterogeneous
          physical analog in-memory accelerators, then runs only the single
          best chip for a given energy budget with a fallback for low-
          confidence inputs — turning "which imperfect chip do I trust"
          into a certified statistical decision rather than a design
          heuristic (ensemble-everything vs. trust-one-blindly). Distinct
          from FALCON (arXiv:2609.00701, covered 2026-09-02) and its MTJ-
          focused research line: RACE-AIMC does not commit to a specific
          emerging-NVM device technology and addresses reliability via a
          statistical certification framework rather than a fault-tolerant
          architecture, so it is kept as its own candidate rather than
          merged into in-memory-computing-emerging-nvm-hardware-gap.

    rationale: >
      A single paper so far, but a potentially reusable idea beyond this
      specific accelerator class: per-unit statistical certification could
      plausibly generalize to any edge deployment with device-to-device
      variability (digital NPUs, MCU fleets with process variation/aging),
      not just analog in-memory computing. Worth watching for a second,
      independent paper — either another AIMC reliability paper or a
      certified/selective-inference paper applied to a different edge
      accelerator class — before treating this as a mature direction.

    action_hint: monitor for a second, independent paper applying certified/risk-aware selective inference to imperfect edge accelerators (same or different hardware class) before review

  - id: robotics-edge-ai-applications-gap
    title: "Robotics / Autonomous-Systems Applications of EdgeAI (Applications Taxonomy Gap)"

    status: ready_for_review

    first_seen: 2026-09-13
    last_seen: 2026-09-27

    possible_existing_concept: null

    evidence:
      - source: 03_Digests/Weekly/2026-09-27_weekly_digest.md
        papers:
          - "FoldQuantVLA: Native Low-Bit Quantization of Vision-Language-Action Models via Consistent Folding"
          - "VLAQuantBench: Closed-Loop Evaluation of Post-Training Quantization for Vision-Language-Action Models"
        note: >
          Third consecutive week. FoldQuantVLA (Ho, Nguyen, Nguyen,
          Duong, Le, Guo, Ngo, Le; arXiv:2609.24433) is a fourth
          independent group: native W4A4 TensorRT execution of GR00T and
          pi0.5 on Jetson AGX Orin (1.20-1.33x) with 80-trial real-robot
          validation per configuration. VLAQuantBench (arXiv:2609.25376)
          is from the PreDE group (Xu, Chen, Shi) and is therefore NOT
          independent, but its 409-run closed-loop benchmark reaches a
          compatible conclusion: a few specific layers, not bit width,
          decide whether a quantized VLA still works. Both again sit at
          the GPU-class onboard tier, reinforcing the tier-scope question
          already flagged for the reviewer.

      - source: 03_Digests/Weekly/2026-09-20_weekly_digest.md
        papers:
          - "Predict Before You Deploy: Offline Prediction of Quantization-Induced Task Degradation for World Action Models"
          - "Recovering Aggressively Pruned Vision-Language-Action Models with Offline Hidden-State Distillation"
        note: >
          Two independent robotics-EdgeAI papers in the same week, from
          groups unrelated to each other and to the APEX-RBD authors.
          PreDE (Xu, Guo, Chen, Du, Shi; arXiv:2609.19441) applies
          post-training quantization to world action models for on-robot
          deployment and validates an offline accept/reject/defer rule in
          450 real Franka Research 3 trials (W4A4: 1.37x action-query
          speedup, ~44% lower peak memory on the robot). The VLA pruning
          paper (Kim, Choi, Lee; arXiv:2609.19579) width-prunes a VLA
          language backbone by up to 87% and recovers it offline via
          hidden-state distillation, with on-board measurements on a
          6-DoF manipulator (2.23x faster, 62% less memory at 72%
          reduction). Both use Algorithms-branch techniques
          ([[Quantization]], [[Pruning]], [[Distillation]]) under an
          explicit on-robot resource constraint. Note the hardware tier is
          GPU-class onboard compute, above APEX-RBD's accelerator-design
          framing and the Observatory's MCU core; the reviewer should
          decide whether "Robotics" is one Applications concept spanning
          tiers or whether large-model-on-robot work belongs closer to
          Generative_EdgeAI / MoE_Edge_LLM_Serving.

      - source: 03_Digests/Weekly/2026-09-13_weekly_digest.md
        papers:
          - "APEX-RBD: Mixed-Precision Exploration Framework for Hardware-Efficient Robot Dynamics Accelerator Design"
        note: >
          00_Taxonomy/taxonomy.md's "Known gaps" section has long flagged
          "Robotics / autonomous-systems applications of EdgeAI" as a
          plausible Applications-branch gap with no credible anchor paper.
          APEX-RBD (Liu, Fan, Ma, Liang, Hu, Xu, Zhang) applies mixed-
          precision quantization exploration specifically to Rigid Body
          Dynamics accelerators for resource-constrained robotic control,
          the first paper this Observatory has found that combines an
          established Algorithms-branch technique ([[Quantization]]) with
          a robotics-specific hardware target under an edge/resource-
          constrained framing. Treated as a first, single anchor rather
          than already-corroborated.

    rationale: >
      First anchored by a single paper (APEX-RBD, 2026-09-13) filling a
      gap the taxonomy had named for a while. One week later two further
      independent papers appeared (PreDE; pruned-VLA recovery), so the
      Observatory's two-independent-anchor convention for a new
      Applications-branch concept is now met across two weeks and three
      unrelated groups. Promoted to ready_for_review on 2026-09-20. Open
      question for the reviewer: the three anchors sit at different
      hardware tiers (custom RBD accelerator vs. GPU-class onboard
      compute), so the concept's scope needs an explicit decision.

    action_hint: review in the next Knowledge Base Consolidation cycle; consider formalizing "Robotics / Autonomous Systems" as an Applications-branch concept per taxonomy.md's known-gaps note, with an explicit statement of which hardware tiers it covers and cross-links to Quantization, Pruning, Distillation and Generative_EdgeAI

  - id: restricted-operator-set-codesign-mcu-npu
    title: "Restricted Operator Sets as the Binding Deployment Constraint on Microcontroller-Class NPUs"

    status: watching

    first_seen: 2026-09-27
    last_seen: 2026-09-27

    possible_existing_concept: NPU

    evidence:
      - source: 03_Digests/Weekly/2026-09-27_weekly_digest.md
        papers:
          - "Beyond Model Size: Redesigning LiSenNet for embedded speech enhancement"
          - "NPLSD: Accelerating Line-Segment Detection on NPU Microcontrollers"
          - "NAVIR: Neuromorphic Audio-Visual Speech Recognition for Robust Human-Robot Interaction on Edge Hardware"
        note: >
          Three papers in one week from three unrelated groups and two
          accelerator families, all making the same observation: on
          microcontroller-class NPUs the property that decides whether a
          model runs is not parameter count or MACs but whether every
          operator is in the accelerator's static integer graph. LiSenNet
          (Laroche, Olsson; arXiv:2609.29866) replaces a recurrent
          bottleneck with convolutional mixers and bounds activations to
          fit the STM32N6 Neural-ART, reaching a 0.30 real-time factor,
          and finds stateless recomputation 10x slower despite higher
          accelerator utilization. NPLSD (Panahi, Jalilvand, Najafi;
          arXiv:2609.25022) characterizes, operator by operator, why
          transformer line detectors cannot run on the same NPU
          (attention, grid-sampling, normalization; a 39 MB attention
          score tensor) and rebuilds them convolutionally. NAVIR
          (Delimpasis et al.; arXiv:2609.24391) factorises an
          audio-visual speech recognizer into 2D-conv-only modules
          because BrainChip Akida supports nothing else. Supporting
          context, same digest: the early-exit speech-enhancement study
          (Laroche, Miccini; arXiv:2609.29867) must split a depth-varying
          model into several static NPU graphs on STM32N6; Scholar
          surfaced a fourth STM32N6 deployment (Abdalla, crowd counting,
          openreview) and an earlier STM32N6 CubeSat study (Capogrosso,
          Magno, 2026), neither read in full.

    rationale: >
      Created after a single digest, which is unusual, because the
      two-independent-anchor convention is already exceeded (three
      groups, two NPU families) and the signal is squarely at the
      Observatory's core Cortex-M / MCU-NPU tier. Kept at "watching"
      rather than "ready_for_review" to respect the multi-week rule; a
      recurrence in any later digest should be enough to promote it. The
      existing NPU concept page treats NPUs as throughput accelerators;
      this signal argues the concept (or a Frameworks-side companion on
      vendor NPU toolchains) needs an explicit "operator-set
      compatibility and static-graph constraints" dimension, and it is
      closely related to the measurement-infrastructure candidate: both
      say MCU/NPU deployability is a runtime/toolchain property that
      MACs and bare-metal benchmarks do not capture.

    action_hint: watch for one more independent MCU-NPU paper (Ethos-U, Neural-ART, Akida or a RISC-V NPU) whose central difficulty is operator support rather than model size; then review jointly with mcu-npu-measurement-infrastructure and decide between extending Hardware/NPU.md with an operator-set/static-graph section or opening a Frameworks-branch concept on vendor NPU toolchains
