    rationale: >
      A single paper so far, filling a gap the taxonomy has named for a
      while but could not previously anchor. Consistent with the
      Observatory's two-independent-anchor convention for new
      Hardware/Applications taxonomy branches, kept at "watching" pending
      a second, independent EdgeAI-robotics paper (any algorithmic or
