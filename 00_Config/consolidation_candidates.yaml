# EdgeAI Observatory — Consolidation Candidate Queue
#
# This is the ACTIVE working queue of research signals accumulated by the
# Weekly and Monthly monitoring cycles that are being watched for possible
# future promotion into the persistent Knowledge Base (01_Knowledge_Base/).
#
# This file is NOT a second Knowledge Base. It stays deliberately lightweight:
# no numerical evidence scores, no long-form technical content — just enough
# provenance (which digest, which papers, why) for the on-demand Knowledge
# Base Consolidation task to review later.
#
# Ownership of this file:
#   - Weekly Digest task:   may append evidence to an existing candidate,
#                           create a new "watching" candidate, or promote a
#                           candidate's status from "watching" to
#                           "ready_for_review". Must NOT create or modify
#                           anything under 01_Knowledge_Base/.
#   - Monthly Report task:  same permissions as Weekly, plus merging
#                           duplicate/synonymous candidates and creating
#                           candidates visible only through cross-week
#                           synthesis. Must NOT create or modify anything
#                           under 01_Knowledge_Base/.
#   - Knowledge Base Consolidation task (on-demand, explicit request only):
#                           the ONLY task allowed to resolve a candidate
#                           (promoted / merged / rejected) and move it to
#                           00_Config/consolidation_history.yaml.
#
# Status values:
#   watching          - an open signal, not yet mature enough for review.
#   ready_for_review  - independent evidence has accumulated across multiple
#                        observations; mature enough for an explicit,
#                        human-triggered Knowledge Base Consolidation cycle
#                        to decide its fate. This status does NOT itself
#                        promote anything into the Knowledge Base.
#
# Bootstrapped 2026-09-02 from already-existing Weekly Digest / Monthly Report
# / taxonomy evidence; resolved candidates move to consolidation_history.yaml.
# No candidate is ever invented: each evidence entry references an actual
# Observatory file. The "Known gaps" section of 00_Taxonomy/taxonomy.md must
# always list exactly the candidates present here (same set, same count) —
# tools/check_consistency.py warns when the two drift apart.

candidates:

  - id: mcu-npu-measurement-infrastructure
    title: "Standardized Measurement Infrastructure for MCU/NPU-Class Edge Inference"

    status: ready_for_review

    first_seen: 2026-08-31
    last_seen: 2026-10-01

    possible_existing_concept: MLPerf_Tiny

    evidence:
      - source: 03_Digests/Monthly/2026-09_monthly_report.md
        papers:
          - "Design-Space Exploration of TinyML Workloads on Heterogeneous Processing Targets for AI-Enabled Wearables"
          - "A Memristor-Based In-Memory Computing System-on-Chip with Efficient Depthwise Convolution"
        note: >
          Monthly synthesis (2026-10-01). Cross-week reading of the
          September digests shows the measurement gap and the
          restricted-operator-set candidate are two faces of one
          question: what a harness at the MCU/NPU tier must capture is
          which operators fall back to the CPU and what that costs, not
          MACs per second. Three independent papers in one month used
          MLPerf Tiny workloads as a yardstick outside the official
          submission process (EPIC's fine-tuning numbers; the smart-
          glasses VWW variant; the memristor SoC's 80.36% VWW result,
          Song et al., Advanced Intelligent Systems 2026, DOI
          10.1002/aisy.202501225, Scholar-surfaced, snippet-level), which
          supports option (b) of the action hint -- extending
          MLPerf_Tiny.md with a realism/known-limitations section -- as
          the lower-cost first step. A Scholar-surfaced wearables
          design-space exploration (Penner, Wittenfeld, Voss, Hesse;
          IEEE-EMBS 2026; OpenReview; not read in full) addresses the
          same benchmark-realism question from the wearables side.
          Recommend reviewing jointly with
          restricted-operator-set-codesign-mcu-npu.

      - source: 03_Digests/Weekly/2026-09-27_weekly_digest.md
        papers:
          - "RAMP: Robust Adaptive Mixed-Precision Quantization for Edge CPU Vision Models"
          - "Same Bit Width, Different Outcomes: Post-Training Quantization of Text-to-Speech Across Architectures"
        note: >
          Two further independent corroborations that quantization outcomes
          must be validated on the target runtime rather than predicted
          from bit width or simulated cost. RAMP (Poblacion-Criado,
          Garcia-Gasulla, Quinones; BSC; BMVC 2026; arXiv:2609.28262)
          shows widely used layer-sensitivity proxies fail catastrophically
          on 4-6 of 8 model/ARM64-hardware configurations and that
          excluding low-speed-up layers can fragment the graph and disable
          operator fusion -- a runtime effect no sensitivity metric can
          see. The TTS PTQ study (Park, Kim, Park; arXiv:2609.28974) finds
          the same bit width gives model-specific outcomes and that real
          int8 kernels can be slower than a 4-bit weight kernel on the
          same machine. Neither adds the missing MCU/NPU-tier
          methodology; both strengthen the "benchmark realism /
          validate-on-target" framing. A Scholar-only Elsevier Array SLR
          (Mahfouz et al., 2026) reportedly quantifies up to 60% error of
          digital-twin energy/latency estimates against real MCU
          measurements, but was blocked by a bot check and is recorded at
          snippet level only.

      - source: 03_Digests/Weekly/2026-09-20_weekly_digest.md
        papers:
          - "Is INT8 Portable? A Cross-Platform Measurement Study of Quantized Inference on Embedded and Automotive Accelerators"
          - "Deploying TinyML on Commercial Smart Glasses"
        note: >
          Two independent papers in one week, from unrelated groups. The
          INT8-portability study (Shin; arXiv:2609.16085) is the first
          paper found that offers a reusable, open, artifact-fixed
          cross-chip measurement *methodology* (scripts + 32 reports
          released) rather than a single chip's self-report -- exactly
          the kind of thing EPIC lacked -- covering ARM/x86 CPUs, Jetson
          Orin iGPU + NVDLA, and two vendor NPUs (Qualcomm Hexagon HTP,
          DEEPX DX-M1). It still stops above the Cortex-M / Ethos-U /
          RISC-V-NPU tier. The smart-glasses paper (Krumpl, Corti, Wang,
          Saukh; TU Graz; EWSN 2026 EMERGE workshop) adds a complementary
          MCU-tier (nRF52840, Cortex-M4) observation: MLPerf Tiny-style
          bare-metal numbers do not transfer to a real wearable because
          firmware co-residency and the sensor/JPEG pipeline set the
          effective budget and end-to-end latency. Together they suggest
          the concept may be better framed as "edge inference measurement
          methodology and benchmark realism" spanning tiers, with the
          MCU/NPU tier as its still-open sub-gap.

      - source: 03_Digests/Weekly/2026-09-13_weekly_digest.md
        papers:
          - "EPIC: An 1.34-TOPS/W, 16-GOPS/mm2 Digital In-Memory-Computing-Based AI Microcontroller Unit Supporting On-Chip Model Fine-Tuning for a TinyML Device"
        note: >
          Partial, not full, corroboration: EPIC (Lin, Moon, Huang, Seok;
          Columbia; IEEE TCAS-I 2026) is a fabricated 28nm AI MCU reporting
          rigorous, standard-benchmark (MLPerf Tiny) efficiency numbers for
          both inference and on-chip fine-tuning, at exactly the MCU/NPU
          tier this candidate names as missing. Kept short of promoting to
          ready_for_review because EPIC is a single chip's own
          self-reported benchmark result, not a reusable, open measurement
          *methodology/framework* others can apply across different
          MCU/NPU chips the way Hydra does for Jetson-class hardware --
          the specific gap this candidate names. Still a meaningful signal
          that MLPerf-Tiny-grounded rigor is starting to reach this tier.

      - source: 03_Digests/Weekly/2026-08-31_weekly_digest.md
        note: >
          Source digest for Hydra (open, phase-aware Jetson AGX measurement
          framework) and the Apple Neural Engine measurement study, both
          cited by the August monthly report as the basis for this
          direction.

      - source: 03_Digests/Monthly/2026-08_monthly_report.md
        note: >
          Names "a standardized, open measurement methodology for MCU/NPU-
          class inference, not just Jetson/Apple-silicon-class" as a ready-
          for-deeper-investment research direction: Hydra and the ANE study
          both build rigorous, open, reproducible characterization
          infrastructure, but neither has an analogue at the Cortex-M /
          microcontroller-NPU tier the Observatory's core taxonomy centers
          on.

      - source: 02_Papers/2026/2026_Taherin_Hydra.md
        note: >
          Full deep-analysis record created 2026-09-02 during a deliberate
          coverage-gap-closing pass — confirms Hydra covers Jetson AGX
          Xavier/Orin/Thor only (workstation/embedded-GPU tier), not
          MCU/NPU-class hardware.

      - source: 02_Papers/2026/2026_Bryngelson_AppleNeuralEngine.md
        note: >
          Full deep-analysis record also created 2026-09-02 — confirms the
          ANE study covers the A11-A18/M1-M5 Apple-silicon family, again
          not MCU/NPU-class hardware. Both papers are now rigorously
          recorded, but the specific MCU/Ethos-U/RISC-V-NPU-tier gap this
          candidate names remains genuinely unresolved — no paper at that
          tier was found in this pass.

    rationale: >
      A genuine systems/benchmark-gap signal first identified through
      monthly synthesis of two measurement-focused papers (Hydra, ANE
      study), then partially corroborated at the MCU tier by EPIC
      (2026-09-13), and now corroborated by two further independent
      papers (2026-09-20): an open cross-platform INT8 measurement
      methodology at the edge-accelerator tier and an MCU-tier
      benchmark-realism study on a commercial wearable. Evidence now spans
      three weekly digests, one monthly report, and five papers from five
      unrelated groups. Promoted to ready_for_review on 2026-09-20. The
      narrow "open methodology at the Cortex-M/Ethos-U/RISC-V-NPU tier"
      gap is still not closed by any single paper; the reviewer should
      decide whether to formalize the broader concept now (with that tier
      as an explicit open sub-gap) or keep waiting for a tier-specific
      anchor.

    action_hint: review in the next Knowledge Base Consolidation cycle, jointly with restricted-operator-set-codesign-mcu-npu; decide between (a) a new Benchmarks_Datasets-branch concept on measurement methodology / benchmark realism for edge inference, with the MCU/NPU tier flagged as open, or (b) extending MLPerf_Tiny.md with a "known limitations / realism" section and keeping the tier-specific gap in taxonomy.md

  - id: in-memory-computing-emerging-nvm-hardware-gap
    title: "In-Memory Computing with Emerging Non-Volatile Memory (Hardware Taxonomy Gap)"

    status: ready_for_review

    first_seen: 2026-09-02
    last_seen: 2026-10-01

    possible_existing_concept: null

    evidence:
      - source: 03_Digests/Monthly/2026-09_monthly_report.md
        papers:
          - "A Memristor-Based In-Memory Computing System-on-Chip with Efficient Depthwise Convolution"
          - "Beyond Noise: Understanding and Overcoming Temperature Effects in Analog DNN Inference"
        note: >
          Monthly synthesis (2026-10-01). The Google Scholar keyword
          sweep surfaced the independent second anchor the action hint
          asked for: a fabricated 65nm memristor (ReRAM-class) in-memory-
          computing system-on-chip with a zig-zag selection-line topology
          for depthwise convolution, measured at 21.3 TOPS/W at 100 MHz
          and reaching 80.36% on Visual Wake Words with a tailored
          MobileNetV1 (Song, Cai, Park, Li, Lee et al.; Advanced
          Intelligent Systems 2026; DOI 10.1002/aisy.202501225). No author
          overlap with the Razi/Moghadam/Aygun/Najafi/Riedel program;
          measured silicon rather than simulation; MLPerf-Tiny-grade
          workload. Read at abstract/snippet level only -- the full text
          must be verified before a 02_Papers/ record is created.
          Cross-week context the weeklies did not connect: within the
          same month the field attacked "imperfect physical compute" from
          three independent angles -- tolerate it architecturally
          (FALCON), calibrate or train it away (the ECML-PKDD 2026
          workshop temperature study, arXiv:2609.15527, which finds
          systematic non-idealities rather than stochastic noise dominate
          temperature-induced degradation), or certify around it
          statistically (RACE-AIMC, tracked under
          certified-selective-inference-imperfect-edge-accelerators).
          Digital IMC chips with no emerging-NVM element (EPIC, FlexSpIM)
          appeared the same month and belong to NPU /
          Event-Driven_Neuromorphic_Accelerators rather than here, but
          they show in-memory computing is now the densest Hardware
          thread overall.

      - source: 03_Digests/Weekly/2026-09-02_weekly_digest.md
        papers:
          - "FALCON: Fault-Tolerant Magnetic Tunnel Junction-Based In-Memory Stochastic Architecture for Reliability-Critical Edge AI Applications"
        note: >
          Magnetic Tunnel Junction (MTJ) in-memory computing combined with
          stochastic computing for noise/variation tolerance, validated in
          14nm FinFET. Digest explicitly flags this as not mapping cleanly
          onto the current Hardware taxonomy and suggests "in-memory
          computing / emerging non-volatile memory" as a possible new
          Hardware branch entry, rather than adopting it unilaterally.

      - source: 02_Papers/2026/2026_Razi_FALCON.md
        note: >
          Full deep-analysis record created 2026-09-02 during a deliberate
          coverage-gap-closing pass. Two candidate second-anchor papers
          were located (an April 2026 MTJ logic-in-memory parallelism
          paper, arXiv:2604.23146, and a DAC 2025 ReRAM stochastic-
          computing paper) but both share authors with FALCON (Razi,
          Moghadam, Aygun, Najafi, and overlapping collaborators) — a
          real, active single research program (three papers in ~18
          months) rather than independent corroboration. Not recorded as
          separate 02_Papers/ entries; noted here as evidence the space is
          active, not as independent anchors.

    rationale: >
      First anchored by a single active research program (FALCON and its
      MTJ/ReRAM stochastic-computing predecessors). The monthly Scholar
      sweep of 2026-10-01 found an independently-authored, fabricated,
      measured memristor in-memory-computing SoC reporting a Visual Wake
      Words result (Song et al., Advanced Intelligent Systems 2026), which
      meets the two-independent-anchor convention for a Hardware-branch
      concept. Promoted to ready_for_review on 2026-10-01. The reviewer
      should (1) verify the memristor SoC from its full text before
      creating a record, (2) decide whether the concept is "in-memory
      computing with emerging NVM" narrowly or "in-memory / compute-in-
      memory accelerators" broadly -- the broad reading would also absorb
      EPIC-style digital IMC and overlap with NPU and
      Event-Driven_Neuromorphic_Accelerators, so the narrow reading is the
      safer first step -- and (3) consider whether
      certified-selective-inference-imperfect-edge-accelerators should
      become an "open problems" entry of the new concept rather than a
      separate candidate.

    action_hint: review in the next Knowledge Base Consolidation cycle; verify DOI 10.1002/aisy.202501225 in full text, then decide between a new Hardware-branch concept (emerging-NVM in-memory computing, anchored by FALCON and the memristor SoC) or deferring until a third anchor appears

