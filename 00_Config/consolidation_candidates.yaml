        papers:
          - "TinyML Enhances CubeSat Mission Capabilities"
          - "QScheduler: Adaptive Gradient Sampling for Zeroth-Order On-Device Training on INT8 NPUs"
          - "Is INT8 Portable? A Cross-Platform Measurement Study of Quantized Inference on Embedded and Automotive Accelerators"
        note: >
          Monthly synthesis (2026-10-01). The Google Scholar keyword sweep
          and a cross-week reading add three independent corroborations
          from groups unrelated to the three weekly anchors. (1)
          Capogrosso and Magno (ETH Zurich; ACM/IEEE ICCPS 2026;
          arXiv:2603.20174) frame their whole STM32N6 CubeSat deployment
          pipeline as "hardware-aware operator mapping" that maximizes
          Neural-ART operator coverage, with 0.68-6.45 mJ and 3.22-30.38
          ms per inference -- the Scholar-only item of 2026-09-27 is now
          confirmed from its arXiv abstract. (2) QScheduler (Amaral,
          Demaj, Libessart, Folliot et al.; arXiv:2607.18802) extends the
          constraint from inference to training: because the Neural-ART
          has no backward-pass primitives, on-device training on it must
          be zeroth-order (forward passes only), giving the first INT8
          on-device training proof-of-concept on that NPU. (3) The
          INT8-portability study (arXiv:2609.16085, already recorded
          under mcu-npu-measurement-infrastructure) shows vendor NPUs
          "own" quantization -- a bring-your-own QDQ graph fails silently
          on one NPU (accuracy 0.75 -> 0.005 while compiling and running
          without error) and loudly on the other -- which is the same
          toolchain-decides-deployability fact at the Hexagon/DX-M1
          tier. Evidence now spans five unrelated groups, three
          accelerator families and both inference and training, which
          exceeds the multi-week rule the weekly deferred to.

      - source: 03_Digests/Weekly/2026-09-27_weekly_digest.md
        papers:
          - "Beyond Model Size: Redesigning LiSenNet for embedded speech enhancement"
          - "NPLSD: Accelerating Line-Segment Detection on NPU Microcontrollers"
          - "NAVIR: Neuromorphic Audio-Visual Speech Recognition for Robust Human-Robot Interaction on Edge Hardware"
        note: >
          Three papers in one week from three unrelated groups and two
          accelerator families, all making the same observation: on
          microcontroller-class NPUs the property that decides whether a
          model runs is not parameter count or MACs but whether every
          operator is in the accelerator's static integer graph. LiSenNet
          (Laroche, Olsson; arXiv:2609.29866) replaces a recurrent
          bottleneck with convolutional mixers and bounds activations to
          fit the STM32N6 Neural-ART, reaching a 0.30 real-time factor,
          and finds stateless recomputation 10x slower despite higher
          accelerator utilization. NPLSD (Panahi, Jalilvand, Najafi;
          arXiv:2609.25022) characterizes, operator by operator, why
          transformer line detectors cannot run on the same NPU
          (attention, grid-sampling, normalization; a 39 MB attention
          score tensor) and rebuilds them convolutionally. NAVIR
          (Delimpasis et al.; arXiv:2609.24391) factorises an
          audio-visual speech recognizer into 2D-conv-only modules
          because BrainChip Akida supports nothing else. Supporting
          context, same digest: the early-exit speech-enhancement study
          (Laroche, Miccini; arXiv:2609.29867) must split a depth-varying
          model into several static NPU graphs on STM32N6; Scholar
          surfaced a fourth STM32N6 deployment (Abdalla, crowd counting,
          openreview) and an earlier STM32N6 CubeSat study (Capogrosso,
          Magno, 2026), neither read in full.

    rationale: >
      Created after a single digest, which is unusual, because the
      two-independent-anchor convention was already exceeded (three
      groups, two NPU families) and the signal is squarely at the
      Observatory's core Cortex-M / MCU-NPU tier; held at "watching" to
      respect the multi-week rule. The monthly synthesis of 2026-10-01
      supplied the recurrence that rule asked for, from two further
      unrelated groups (Capogrosso/Magno; Amaral et al.) and with the
      constraint shown to govern training as well as inference. Promoted
      to ready_for_review on 2026-10-01. The existing NPU concept page
      treats NPUs as throughput accelerators; this signal argues the
      concept (or a Frameworks-side companion on vendor NPU toolchains)
      needs an explicit "operator-set compatibility and static-graph
      constraints" dimension. It is closely related to the measurement-
      infrastructure candidate -- both say MCU/NPU deployability is a
      runtime/toolchain property that MACs and bare-metal benchmarks do
      not capture -- and the two should be decided together.

    action_hint: review in the next Knowledge Base Consolidation cycle, jointly with mcu-npu-measurement-infrastructure; decide between extending Hardware/NPU.md with an operator-set/static-graph section (lower cost, keeps the Hardware/Frameworks split intact) or opening a Frameworks-branch concept on vendor NPU toolchains (ST Edge AI / Neural-ART, Arm Vela / Ethos-U, BrainChip MetaTF, Qualcomm QNN) anchored by LiSenNet, NPLSD, NAVIR and the CubeSat pipeline

  - id: predeployment-quantization-degradation-prediction
    title: "Pre-Deployment Prediction of Quantization-Induced Degradation (Offline Proxies with Accept/Reject/Defer Decisions)"

    status: watching

    first_seen: 2026-10-01
    last_seen: 2026-10-01

    possible_existing_concept: Quantization

    evidence:
      - source: 03_Digests/Monthly/2026-09_monthly_report.md
        papers:
          - "Predict Before You Deploy: Offline Prediction of Quantization-Induced Task Degradation for World Action Models"
          - "Predicting Quantization Price for Selecting PTQ Configurations Before Deployment"
          - "RAMP: Robust Adaptive Mixed-Precision Quantization for Edge CPU Vision Models"
          - "VLAQuantBench: Closed-Loop Evaluation of Post-Training Quantization for Vision-Language-Action Models"
          - "Same Bit Width, Different Outcomes: Post-Training Quantization of Text-to-Speech Across Architectures"
        note: >
          Created by monthly synthesis (2026-10-01); the 2026-09-27 weekly
          deliberately deferred this pattern to the monthly. Across the
          2026-09-20 and 2026-09-27 digests, five papers from four
          unrelated groups converge on one algorithmic question: can the
          task-level damage of a post-training quantization configuration
          be predicted cheaply, before any deployment or closed-loop
          evaluation? PreDE (Xu, Guo, Chen, Du, Shi; arXiv:2609.19441)
          calibrates two thresholds on offline action deviations and
          issues accept/reject/defer decisions (21 of 28 held-out
          configurations decided before any robot trial, all correct,
          validated in 450 Franka trials). "Quantization Price" (Qiu, Mu,
          Zhang, Shu; arXiv:2609.28270) prices each layer configuration's
          output-error covariance by downstream curvature, 1/2 Tr(H Sigma),
          so formats, granularities, codebooks and transformations become
          comparable candidates in one table. RAMP (Poblacion-Criado,
          Garcia-Gasulla, Quinones; BMVC 2026; arXiv:2609.28262) is the
          negative result: gradient- and weight-based sensitivity proxies
          fail catastrophically on 4 and 2 of 8 model/ARM64 configurations
          while Jensen-Shannon divergence of layer outputs never does.
          VLAQuantBench (same group as PreDE, so not independent of it;
          arXiv:2609.25376) and the TTS PTQ study (Park, Kim, Park;
          arXiv:2609.28974) supply the motivating evidence that outcomes
          are architecture- and layer-specific and not predictable from
          bit width or model class.

      - source: 03_Digests/Weekly/2026-09-27_weekly_digest.md
        note: >
          Source digest for RAMP, "Quantization Price", VLAQuantBench and
          the TTS PTQ study; its consolidation-queue note explicitly
          flagged "predict quantization degradation before deploying" as
          visible from four unrelated groups in two weeks and left the
          decision to the monthly synthesis.

      - source: 03_Digests/Weekly/2026-09-20_weekly_digest.md
        note: >
          Source digest for PreDE, whose thesis hook ("offline proxies for
          compressed-model safety beyond robotics") first named the
          pattern.

    rationale: >
      Visible only at month level: no single week contained more than
      three of the five papers, and the weekly that saw four of them
      chose to defer. The pattern is distinct from
      mcu-npu-measurement-infrastructure (which asks what actually
      happens on a given chip) in that it is an algorithmic direction --
      calibrated offline predictors with explicit deferral -- that lives
      inside Quantization rather than in Benchmarks_Datasets. Kept at
      "watching" because the strongest anchors are preprints at the GPU
      tier (PreDE, Quantization Price) and the only peer-reviewed one
      (RAMP) is a negative result about proxies; a predictor validated
      on MCU- or NPU-class hardware, or a second peer-reviewed positive
      result from an unrelated group, would justify review.

    action_hint: watch for a pre-deployment degradation predictor validated on Cortex-M/NPU-class hardware or a second peer-reviewed positive result from an unrelated group; then decide between a "Pre-deployment prediction" subsection in Algorithms/Quantization.md (preferred) and a separate concept

  - id: integer-only-npu-constrained-on-device-training-mcu
    title: "Resource-Accounted and NPU-Constrained On-Device Training on Microcontrollers"

    status: watching

    first_seen: 2026-10-01
    last_seen: 2026-10-01

    possible_existing_concept: On-device_Learning

    evidence:
      - source: 03_Digests/Monthly/2026-09_monthly_report.md
        papers:
          - "eODL: Energy-Aware On-Device Training on Microcontrollers"
          - "SRAM budgeting for on-device training: Accounting, feasible suffix selection, and a configuration-dependent crossover analysis"
          - "TinyMQT: A Memory-Efficient Mixed-Quantization Training Framework for Embedded Devices"
          - "QScheduler: Adaptive Gradient Sampling for Zeroth-Order On-Device Training on INT8 NPUs"
          - "Sparse-BP: Efficient On-Device Backpropagation for Resource-Constrained Systems"
        note: >
          Created by monthly synthesis (2026-10-01) from the Google
          Scholar keyword sweep ("on-device training" microcontroller,
          sorted by date), which surfaced a cluster no weekly had seen:
          eODL (Liu, Suresh, Zuniga; EWSN 2026 WiP) measures actual STM32
          training energy across back-propagation depths to test MACs as
          an energy proxy; the SRAM-budgeting framework (Jeong, Oh;
          Journal of Systems Architecture 2026, Elsevier) accounts for
          peak training memory and selects feasible trainable suffixes
          with a configuration-dependent crossover analysis; TinyMQT
          (Tao, Jia, Deng, Wang; IEEE Embedded Systems Letters 2026)
          bounds the peak SRAM footprint of back-propagation via
          mixed-quantization training; QScheduler (Amaral et al.;
          arXiv:2607.18802) does zeroth-order training on the STM32N6
          Neural-ART because the NPU has no backward-pass primitives;
          Sparse-BP (Nawaiseh, Catalfamo et al.; IEEE 2026) integrates
          stochastic sparse back-propagation on MCU boards. All five
          are from unrelated groups and all were read at Scholar
          snippet level only; none has a 02_Papers/ record. Also noted:
          an embedded on-device training framework with a PyTorch model
          parser (Kargl, Muttenthaler, Eibensteiner et al., 2026) and a
          trust-routing scheme for MCU-class on-device training under
          adversarial contamination (Lazzaro, Merenda; IEEE 2026).

      - source: 03_Digests/Weekly/2026-09-13_weekly_digest.md
        papers:
          - "EPIC: An 1.34-TOPS/W, 16-GOPS/mm2 Digital In-Memory-Computing-Based AI Microcontroller Unit Supporting On-Chip Model Fine-Tuning for a TinyML Device"
        note: >
          Silicon-side anchor: a fabricated 28nm AI MCU co-designed so
          that 8-bit fine-tuning costs no more than inference, with
          MLPerf Tiny results for both.

      - source: 03_Digests/Weekly/2026-09-06_weekly_digest.md
        papers:
          - "FORGE: Forward-Only Test-Time Adaptation for Integer-Only Vision Models on Microcontrollers"
        note: >
          Forward-only adaptation on a BN-folded integer model (ESP32-S3,
          8.3 mJ per adaptation step); like QScheduler, it drops the
          backward pass because the deployed integer runtime has none.

      - source: 03_Digests/Weekly/2026-09-27_weekly_digest.md
        papers:
          - "TinyUDE: Solver-Free Universal Differential Equations on Microcontrollers via Lie-Taylor Jet Matching"
          - "Xronos: Heterogeneity-Aware Tensor Parallelism for Collaborative LLM Fine-Tuning on Edge CPUs"
        note: >
          Two further "also noted" items: solver-free on-MCU fitting
          within 61.3 kB on an ESP32, and the finding that pipeline
          parallelism is ineffective for fine-tuning on CPU-only edge
          devices (5.75x higher compute-stall ratio than GPU devices).

    rationale: >
      Visible only at month level and only through the Scholar sweep:
      the weeklies captured three papers (EPIC, FORGE, TinyUDE) that
      looked like isolated items, while Scholar shows at least five more
      from unrelated groups over the summer, all treating the *cost* of
      training on an MCU (energy, peak SRAM, convergence under integer-
      only or forward-only constraints) as the object of study rather
      than its feasibility. The existing On-device_Learning page
      describes the first-order, float-capable regime; this is a
      distinct, well-populated sub-regime (integer-only runtimes, NPUs
      without backward-pass primitives, explicit energy/SRAM budgets)
      that the page does not yet describe. Not a new concept: the
      natural outcome is an "Evolution of the concept" / "Variants"
      extension of On-device_Learning.md plus 02_Papers/ records for
      the two or three strongest anchors once read in full. Kept at
      "watching" because every Scholar-surfaced paper is snippet-level
      and unverified.

    action_hint: before review, read eODL, the SRAM-budgeting paper and QScheduler in full (EWSN PDF is open; the JSA article needs unige.it access) and confirm they are independent; then extend Algorithms/On-device_Learning.md with an integer-only / NPU-constrained / resource-accounted training subsection rather than opening a new concept
