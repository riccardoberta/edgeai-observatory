  - id: certified-selective-inference-imperfect-edge-accelerators
    title: "Certified / Risk-Aware Selective Inference for Imperfect Physical Edge Accelerators"

    status: watching

    first_seen: 2026-09-06
    last_seen: 2026-09-06

    possible_existing_concept: null

    evidence:
      - source: 03_Digests/Weekly/2026-09-06_weekly_digest.md
        papers:
          - "RACE-AIMC: Selective Inference for Heterogeneous Analog In-Memory Accelerators at the Edge"
        note: >
          RACE-AIMC (Yousuf, Lueker-Boden) computes a mathematically exact,
          per-chip upper bound on error rate for a pool of heterogeneous
          physical analog in-memory accelerators, then runs only the single
          best chip for a given energy budget with a fallback for low-
          confidence inputs — turning "which imperfect chip do I trust"
          into a certified statistical decision rather than a design
          heuristic (ensemble-everything vs. trust-one-blindly). Distinct
          from FALCON (arXiv:2609.00701, covered 2026-09-02) and its MTJ-
          focused research line: RACE-AIMC does not commit to a specific
          emerging-NVM device technology and addresses reliability via a
          statistical certification framework rather than a fault-tolerant
          architecture, so it is kept as its own candidate rather than
          merged into in-memory-computing-emerging-nvm-hardware-gap.

    rationale: >
      A single paper so far, but a potentially reusable idea beyond this
      specific accelerator class: per-unit statistical certification could
      plausibly generalize to any edge deployment with device-to-device
      variability (digital NPUs, MCU fleets with process variation/aging),
      not just analog in-memory computing. Worth watching for a second,
      independent paper — either another AIMC reliability paper or a
      certified/selective-inference paper applied to a different edge
      accelerator class — before treating this as a mature direction.

    action_hint: monitor for a second, independent paper applying certified/risk-aware selective inference to imperfect edge accelerators (same or different hardware class) before review

