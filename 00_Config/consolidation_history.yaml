# EdgeAI Observatory — Consolidation History
#
# Durable record of resolved editorial decisions made by the on-demand
# Knowledge Base Consolidation task. Every entry here started life in
# 00_Config/consolidation_candidates.yaml and was moved here once the
# Consolidation task closed it with one of:
#
#   promoted  - became a new 01_Knowledge_Base/ concept.
#   merged    - folded into an existing 01_Knowledge_Base/ concept.
#   rejected  - reviewed and deliberately not added to the Knowledge Base.
#
# Closed entries preserve their full accumulated evidence (first_seen,
# last_seen, evidence, rationale) exactly as it stood in the active queue,
# plus a `decision` block recording what was decided, when, and why.
#
# This file is written to ONLY by the Knowledge Base Consolidation task and by
# explicit manual editorial passes (marked `via: manual editorial pass` in the
# decision block). The Weekly and Monthly tasks read
# consolidation_candidates.yaml but never write to this file.
#
# First entries: the 2026-09-02 Knowledge Base Consolidation cycle. Entries
# whose evidence cites "taxonomy.md evolution notes" refer to a dated log that
# was part of 00_Taxonomy/taxonomy.md until 2026-09-04 (commit 92a2b3e); it is
# recoverable from git history but no longer present in the file.

history:

  - id: edge-ai-hardware-physical-security
    title: "Hardware / Physical Security of Edge AI Accelerators"

    first_seen: 2026-08-20
    last_seen: 2026-09-02

    possible_existing_concept: null

    evidence:
      - source: 03_Digests/Weekly/2026-08-20_weekly_digest.md
        papers:
          - "YAVIN: A Unified Architecture for Secure Edge Processing in Memory"
        note: >
          Extends TEE (trusted execution environment) trust into
          processing-in-memory, with overhead numbers grounded in quantized
          edge-LLM execution. Flagged in the digest as opening an "Edge AI
          Security / Trusted Execution" taxonomy gap, anchored at that point
          by only this one paper.

      - source: 00_Taxonomy/taxonomy.md
        note: >
          The 2026-08-25 cross-cycle synthesis evolution note explicitly
          names "Edge AI Security / Trusted Execution" as a taxonomy gap
          anchored only by YAVIN, and deliberately leaves it unformalized
          "revisit if a second independent paper appears."

      - source: 03_Digests/Weekly/2026-09-02_weekly_digest.md
        papers:
          - "LLMscope: Extracting LLM Assets from Edge AI Chips via Optical Probing"
        note: >
          A second, independent security-focused paper three weeks later —
          physical/optical extraction of model weights and activations from
          edge accelerator silicon via shared buffer/subcircuit reuse.
          Explicitly called out in the digest as "a new dimension for the
          Observatory" and a taxonomy gap not yet represented in the
          existing Algorithms/Frameworks/Hardware/Applications structure.

    rationale: >
      Two independent papers, three weeks apart, attack different attack
      surfaces (architectural TEE/PIM trust boundary vs. physical/optical
      extraction) but share the same underlying concern: edge AI
      accelerator silicon has security properties that model-level or
      cloud-side security research does not cover. The taxonomy's own
      methodology (set 2026-08-25) treats a second independent paper as the
      explicit trigger to revisit this gap — that trigger has now occurred.
      Whether this becomes one Knowledge Base concept ("hardware security of
      edge AI accelerators") or two (architectural trust vs. physical
      extraction) is a judgment call reserved for explicit Knowledge Base
      review, not for the Weekly/Monthly monitoring layer.

    action_hint: review for possible new Knowledge Base concept (or two related concepts)

    decision:
      date: 2026-09-02
      outcome: promoted
      target: "[[Hardware Security of Edge AI Accelerators]]"
      note: >
        Promoted to a new Knowledge Base concept at
        01_Knowledge_Base/Security/Hardware_Security_of_Edge_AI_Accelerators.md,
        anchored by both papers, verified against their primary arXiv
        abstract pages (2608.13496, 2608.25321). Created a new top-level
        "Security" taxonomy branch since neither Algorithms, Frameworks,
        Hardware, nor Applications fit. Kept as one concept with two named
        variants (architectural trust-boundary extension vs. physical/
        side-channel extraction) rather than splitting into two concepts,
        since the natural next research question (does a TEE/PIM defense
        like YAVIN's protect against a physical probe like LLMscope's?)
        directly connects them — revisit the split if either direction
        grows independently. LLMscope was given a new 02_Papers/ record
        (2026_Mehta_LLMscope.md) as the second anchor; YAVIN's existing
        record was updated to point to the new concept.

